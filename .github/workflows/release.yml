name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# recommended: reset permissions and grant only what each job needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes, push git tags, create releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
          # No registry-url / NODE_AUTH_TOKEN: publishing authenticates via npm
          # Trusted Publishing (OIDC) using the id-token: write permission above.
          # All twelve packages now exist on the registry and carry a trusted
          # publisher, so no token is needed — not even for a first publish.

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full gate
        run: pnpm check

      # changesets/action@v2 (Changesets v3). No pending changesets => publishes;
      # pending changesets => opens/updates the "Version Packages" PR.
      #
      # Publishing is tokenless: every package has a trusted publisher, so the npm
      # CLI authenticates via OIDC. A brand-new package cannot have a trusted
      # publisher until it has been published once, so adding one needs a
      # bootstrap token again (see docs/10-engineering/versioning-and-releases.md).
      - name: Create version PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          push-git-tags: true
