name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# recommended: reset permissions and grant only what each job needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes, push git tags, create releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
          # registry-url is required for NODE_AUTH_TOKEN to reach the npm CLI.
          # It does not disable OIDC: the npm CLI prefers trusted publishing
          # whenever the package has a trusted publisher configured.
          registry-url: 'https://registry.npmjs.org'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full gate
        run: pnpm check

      # changesets/action@v2 (Changesets v3). No pending changesets => publishes;
      # pending changesets => opens/updates the "Version Packages" PR.
      #
      # NPM_TOKEN is a TRANSITIONAL fallback, not the primary path. A package that
      # has never been published cannot have a trusted publisher yet — npm
      # configures those on the package's own settings page — so the first publish
      # of a new package has no OIDC identity to authenticate with. The npm CLI
      # still prefers OIDC for every package that does have one.
      #
      # Remove this env and the NPM_TOKEN secret once all twelve packages have
      # published once and have a trusted publisher configured.
      - name: Create version PR or publish
        uses: changesets/action@v2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          push-git-tags: true
