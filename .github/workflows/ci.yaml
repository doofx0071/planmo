name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded push cancels its predecessor instead of paying for both. Without
# this, pushing twice to a PR branch runs the whole matrix twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS bills at TEN times the Linux rate, so it dominates this workflow:
        # the full matrix costs 1 + 2 + 10 units against ubuntu's 1, and macOS alone
        # is ~77% of the spend. Pull requests run ubuntu + windows; macOS runs on
        # main and on manual dispatch, which still catches platform-specific
        # breakage before a release without paying 10x on every intermediate push.
        #
        # Revert to the full matrix on every event when the billing headroom is
        # comfortable — this is a cost measure, not a correctness one.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: ['24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package boundaries
        run: pnpm boundary-check

      - name: Package inventory
        run: pnpm check:inventory

      - name: CLI smoke
        run: node packages/planmo/dist/bin.js --version

      # The two end-to-end checks install/pack real artifacts, so they run on one
      # OS only — the point is the artifact, not the platform. The lifecycle drives
      # the real built CLI through init -> task -> generate -> handoff and proves
      # durable state survives regeneration; the install check packs every package
      # and installs the CLI from tarballs in isolation (no workspace symlinks).
      - name: End-to-end lifecycle
        if: matrix.os == 'ubuntu-latest'
        run: pnpm e2e:lifecycle

      - name: Isolated npm-tarball install
        if: matrix.os == 'ubuntu-latest'
        run: pnpm e2e:install

  # A changeset on the entry package does not republish its dependencies, so a
  # change to a dependency's source with no changeset of its own ships a stale
  # dependency to the registry while the whole gate above still passes (it runs
  # against workspace source). Catch that here.
  changesets:
    name: changeset coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Every changed publishable package needs a changeset
        run: node scripts/check-changesets.mjs --base=origin/${{ github.base_ref }}